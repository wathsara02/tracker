<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAE6DD;
    --paper-light: #F7F5F0;
    --paper-dark: #DCD6C7;
    --ink: #232220;
    --ink-soft: #726C60;
    --line: #D3CDBF;
    --stamp: #C1440E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 48px 20px 60px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 40px;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  header p {
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 56ch;
    line-height: 1.55;
    margin: 0 0 40px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px 18px 18px;
    position: relative;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover { border-color: var(--card-color, var(--stamp)); transform: translateY(-2px); }

  .tab {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.02em;
    color: var(--card-color, var(--stamp));
    background: color-mix(in srgb, var(--card-color, var(--stamp)) 12%, transparent);
    padding: 3px 8px;
    border-radius: 3px;
    margin-bottom: 12px;
  }

  .card h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 19px;
    margin: 0 0 8px;
  }

  .card p {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 14px;
  }

  .go {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--card-color, var(--stamp));
  }

  footer {
    margin-top: 44px;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">a small collection of things that don't need a server</p>
    <h1>Toolbox</h1>
    <p>Self-contained tools that run in the browser. Add a new one, drop it in its own folder, and list it here.</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer id="footer-note"></footer>
</div>

<script>
  const tools = [
    {
      name: "Software Tracker",
      desc: "Log the programs you install, with links and notes, so a Windows reformat never means reinstalling from memory.",
      href: "software-tracker/",
      tag: "Utility",
      color: "#3F6E52"
    },
    {
      name: "PDF Toolkit",
      desc: "Merge, split, rotate, delete pages, and rebuild PDFs — entirely in your browser, nothing uploaded.",
      href: "pdf-toolkit/",
      tag: "Documents",
      color: "#C1440E"
    }
  ];

  const grid = document.getElementById('grid');
  tools.forEach(t => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = t.href;
    a.style.setProperty('--card-color', t.color);
    a.innerHTML = `
      <span class="tab">${t.tag}</span>
      <h2>${t.name}</h2>
      <p>${t.desc}</p>
      <span class="go">Open →</span>
    `;
    grid.appendChild(a);
  });

  document.getElementById('footer-note').textContent =
    tools.length + (tools.length === 1 ? ' tool' : ' tools') + ' so far.';
</script>
</body>
</html>
